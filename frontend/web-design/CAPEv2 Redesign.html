<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>CAPEv2 — Redesign</title>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { height:100%; margin:0; background:#0a0d12; }
  #root { width:100vw; height:100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="cape-shell.jsx"></script>
<script type="text/babel" src="cape-pages-1.jsx"></script>
<script type="text/babel" src="cape-pages-report.jsx"></script>
<script type="text/babel" src="cape-pages-2.jsx"></script>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;
const { DesignCanvas, DCSection, DCArtboard } = window;

const TWEAKS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "density": "dense",
  "navPos": "side",
  "accentHue": 220
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAKS);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', tweaks.theme);
    document.documentElement.setAttribute('data-density', tweaks.density);
    document.documentElement.style.setProperty('--accent',
      `oklch(0.78 0.13 ${tweaks.accentHue})`);
    document.documentElement.style.setProperty('--accent-strong',
      `oklch(0.86 0.13 ${tweaks.accentHue})`);
    document.documentElement.style.setProperty('--accent-soft',
      `oklch(0.78 0.13 ${tweaks.accentHue} / 0.14)`);
  }, [tweaks.theme, tweaks.density, tweaks.accentHue]);

  const navPos = tweaks.navPos;

  const wrapPage = (page, key) => (
    <window.Shell page={key} navPos={navPos} onNav={()=>{}}>
      {page}
    </window.Shell>
  );

  return (
    <>
      <DesignCanvas title="CAPEv2 — Frontend Redesign" subtitle="SOC analyst tool · dark + light · pages preserve every original CAPE function">
        <DCSection id="report" title="Analysis Report" subtitle="Reimagined: severity-led verdict, tactic-grouped findings, scrubbable detonation timeline · keeps all original CAPE report sections as quick-jump tabs">
          <DCArtboard id="report-summary" label="Report · Summary" width={1480} height={920}>
            {wrapPage(<window.PageReport/>, 'recent')}
          </DCArtboard>
        </DCSection>

        <DCSection id="dashboard" title="Dashboard & Queue" subtitle="At-a-glance triage view: live tasks, machine pool, family distribution, top signatures">
          <DCArtboard id="dashboard" label="Dashboard" width={1480} height={920}>
            {wrapPage(<window.PageDashboard/>, 'dashboard')}
          </DCArtboard>
          <DCArtboard id="pending" label="Pending queue" width={1480} height={920}>
            {wrapPage(<window.PagePending/>, 'pending')}
          </DCArtboard>
        </DCSection>

        <DCSection id="submission" title="Submission & Triage" subtitle="Original submit options preserved (monitor, debugger, dumping, free-form) but reorganized for scanability">
          <DCArtboard id="submit" label="Submit" width={1480} height={920}>
            {wrapPage(<window.PageSubmit/>, 'submit')}
          </DCArtboard>
          <DCArtboard id="recent" label="Recent tasks" width={1480} height={920}>
            {wrapPage(<window.PageRecent onOpen={()=>{}}/>, 'recent')}
          </DCArtboard>
        </DCSection>

        <DCSection id="search" title="Search · Configs · Compare · Stats" subtitle="Power-user views — every CAPE feature kept, just clearer">
          <DCArtboard id="search" label="Search" width={1480} height={920}>
            {wrapPage(<window.PageSearch/>, 'search')}
          </DCArtboard>
          <DCArtboard id="configs" label="Extracted configs" width={1480} height={920}>
            {wrapPage(<window.PageConfigs/>, 'configs')}
          </DCArtboard>
          <DCArtboard id="compare" label="Compare" width={1480} height={920}>
            {wrapPage(<window.PageCompare/>, 'compare')}
          </DCArtboard>
          <DCArtboard id="stats" label="Statistics" width={1480} height={920}>
            {wrapPage(<window.PageStats/>, 'stats')}
          </DCArtboard>
        </DCSection>

        <DCSection id="auth" title="Authentication">
          <DCArtboard id="login" label="Sign in" width={1480} height={920}>
            <window.PageLogin/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="Theme">
          <window.TweakRadio label="Mode" value={tweaks.theme}
            options={[{value:'dark',label:'Dark'},{value:'light',label:'Light'}]}
            onChange={v=>setTweak('theme', v)}/>
          <window.TweakRadio label="Density" value={tweaks.density}
            options={[{value:'dense',label:'Dense'},{value:'comfy',label:'Comfy'}]}
            onChange={v=>setTweak('density', v)}/>
          <window.TweakRadio label="Navigation" value={tweaks.navPos}
            options={[{value:'side',label:'Sidebar'},{value:'top',label:'Top bar'}]}
            onChange={v=>setTweak('navPos', v)}/>
        </window.TweakSection>
        <window.TweakSection title="Accent">
          <window.TweakSlider label="Hue" value={tweaks.accentHue} min={0} max={360} step={5}
            onChange={v=>setTweak('accentHue', v)}/>
          <div style={{display:'flex', gap:6, padding:'4px 0'}}>
            {[220,180,140,40,15,330].map(h=>(
              <button key={h} onClick={()=>setTweak('accentHue', h)}
                style={{width:24, height:24, border:'1px solid #444', borderRadius:'50%',
                  background:`oklch(0.78 0.13 ${h})`, cursor:'pointer'}}/>
            ))}
          </div>
        </window.TweakSection>
      </window.TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
